  - biorxiv
  - dataset
  - benchmark
  - incident
open_full_text_domains:
  - arxiv.org
  - export.arxiv.org
  - biorxiv.org
  - raw.githubusercontent.com
  - githubusercontent.com
  - w3.org
  - schema.org
  - linkml.io
  - researchobject.org

arxiv_max_archive_bytes: 60000000
arxiv_max_stored_text_bytes: 30000000
arxiv_max_single_file_bytes: 6000000
arxiv_max_files: 2500

github_max_tree_response_bytes: 50000000
github_max_evidence_files: 35
github_max_single_file_bytes: 250000
github_max_total_evidence_bytes: 3000000
github_document_excerpt_lines: 220
