config_version: 2
generated_at: null
workers: 12
http_timeout_seconds: 45

generic_max_candidate_urls: 4
generic_max_download_bytes: 30000000
restricted_excerpt_chars: 1500
restricted_pdf_excerpt_pages: 2
open_full_text_max_chars: 1500000

