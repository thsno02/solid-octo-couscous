      github_excluded_rows: 84
  - id: P2
    name: parser_bakeoff_and_document_ir_contract
    depends_on:
      - P1
    production_backfill: false
    benchmark_requirements:
      explicit_uids_in_pr_body: true
      representative_media_and_failure_classes: true
      compare_at_least_two_reasonable_parsers_when_applicable: true
      inspect_content_not_only_exit_status: true
      record_runtime_resources_and_determinism: true
  - id: P3A
    name: unified_ingestion_engine
    depends_on:
      - P2
    outputs:
      - acquisition_adapters
      - media_classifier
      - parser_router
      - parser_run_manifest
      - canonical_document_ir
      - native_sidecars
      - coverage_validator
      - failure_ledger
      - deterministic_replay
    source_specific_production_branches: forbidden_unless_reusable_family_behavior
  - id: P3B
    name: full_nonrepo_backfill
    depends_on:
      - P3A
    target_rows: 131
    default_pull_requests: 1
    maximum_pull_requests_without_new_user_decision: 2
    network_chunks_are_internal_checkpoints: true
    failure_rows_do_not_create_pull_requests_automatically: true
  - id: P4
    name: corpus_reconciliation_and_pr1_scope_correction
    depends_on:
      - P3B
    new_source_acquisition: false
  - id: P5
    name: main_integration_and_fresh_checkout_verification
    depends_on:
      - P4
    merge_method_recommendation: squash
    automatic_merge_authorized: false
    conditional_merge_authority: explicit_user_instruction_after_independent_pass_and_premerge_acceptance
agent_budget:
  max_repair_cycles_per_pull_request: 2
  stop_after_consecutive_no_progress_iterations: 2
  repeated_ci_on_same_head: forbidden
  repeated_evaluation_on_same_head: forbidden
  full_regeneration_before_inputs_frozen: forbidden
  maximum_full_regenerations_per_pull_request: 2
  parser_pr_rebuilds_full_wiki_by_default: false
  single_uid_pull_request_default: forbidden
  single_uid_pull_request_exceptions:
    - work_identity_conflict
    - access_control_or_legal_isolation
    - destructive_storage_migration
    - security_boundary
  exact_api_credit_value:
    guessing: forbidden
    use_efficiency_proxies_when_unavailable: true
execution_efficiency_required_fields:
  - agent_iterations
  - repair_cycles
  - source_rows_touched
  - parser_families_changed
  - coverage_before
  - coverage_after
  - failure_classes_before
  - failure_classes_after
  - full_regenerations
  - repeated_ci_on_same_head
  - repeated_evaluation_on_same_head
independent_pr_gate:
  applies_to: [P0, P1, P2, P3A, P3B, P4, P5]
  evaluator_must_not_author_changes: true
  required_verdict: PASS
  dimensions: [user_requirements, agentic_reasoning_and_evidence, core_quality]
  exact_head_and_base_required: true
  changes_after_review_require_reevaluation: true
  failure_route: planner_executor_independent_evaluator
  normal_completion: merge_after_acceptance
  direct_close_requires: evidence_of_absorption_or_explicit_user_cancellation
  github_agent_review_action: COMMENT
  evaluator_reuse_without_head_change: forbidden
completion_rules:
  capsule_presence_is_fulltext_completion: false
  full_text_label_is_sufficient: false
  parser_exit_zero_is_content_complete: false
  nonempty_text_is_structure_complete: false
  rights_count_is_acquisition_count: false
  ci_green_is_content_complete: false
  trusted_claim_count_is_materialization_complete: false
  unresolved_items_must_remain_explicit: true
  failure_classes_must_be_aggregated: true
  main_fresh_checkout_required: true
prohibited_actions:
  - bypass_access_controls
  - commit_unknown_new_fulltext_then_audit_later
  - automatic_source_deletion
  - storage_migration_without_approval
  - git_history_rewrite_without_approval
  - branch_deletion_without_approval
  - branch_protection_change_without_approval
  - automatic_trusted_promotion
  - generated_conflict_resolution_by_bulk_ours_or_theirs
  - claim_main_completion_while_only_on_work_branch
  - per_uid_pr_for_shared_parser_failure
  - source_specific_parser_code_when_metadata_or_family_config_is_sufficient
  - repeated_ci_without_tree_change
  - repeated_evaluation_without_head_change
  - full_wiki_regeneration_for_parser_only_change_without_semantic_input_change
  - treating_pr_count_or_audit_length_as_progress
decision_gates:
  - id: source_identity_ambiguity
    behavior: stop_affected_identity_and_request_minimal_decision
  - id: access_restricted_single_uid
    behavior: record_unresolved_and_continue_backfill
  - id: public_persistence_unknown_single_uid
    behavior: do_not_commit_new_public_body_record_decision_and_continue_backfill
  - id: shared_parser_failure
    behavior: aggregate_failure_class_fix_engine_once_and_replay_all_affected_uids
  - id: two_no_progress_iterations
    behavior: stop_automation_and_report_measurable_blocker
  - id: third_repair_cycle_needed
    behavior: stop_and_request_review_instead_of_continuing_credit_consumption
  - id: deletion_migration_or_history_rewrite
    behavior: stop_and_require_explicit_authorization
  - id: pr1_ready_and_merge
    behavior: explicit_user_decision_plus_premerge_acceptance_and_independent_evaluator_pass
    current_decision: conditional_completion_authorized_by_user_not_immediate_merge
