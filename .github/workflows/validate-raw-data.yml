name: Validate raw data

on:
  push:
    paths:
      - 'raw_data/**'
      - 'scripts/validate_raw_data.py'
      - '.github/workflows/validate-raw-data.yml'
  pull_request:
    paths:
      - 'raw_data/**'
      - 'scripts/validate_raw_data.py'
      - '.github/workflows/validate-raw-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate collection
        run: python scripts/validate_raw_data.py
