name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.13'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt
      - name: Run offline unit tests
        run: make test
      - name: Verify byte-identical offline replay
        # First build must happen inside replay, against the untouched checkout.
        # Replay also runs the complete read-only validation suite.
        run: make reproducibility
      - name: Require a clean working tree
        shell: bash
        run: |
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
