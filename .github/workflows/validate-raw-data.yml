name: Validate repository knowledge artifacts

on:
  push:
    paths:
      - 'raw_data/**'
      - 'source_registry/**'
      - 'materialized_sources/**'
      - 'pipeline/**'
      - 'docs/**'
      - 'scripts/validate_raw_data.py'
      - 'scripts/validate_materialized.py'
      - 'scripts/validate_docs.py'
      - '.github/workflows/validate-raw-data.yml'
  pull_request:
    paths:
      - 'raw_data/**'
      - 'source_registry/**'
      - 'materialized_sources/**'
      - 'pipeline/**'
      - 'docs/**'
      - 'scripts/validate_raw_data.py'
      - 'scripts/validate_materialized.py'
      - 'scripts/validate_docs.py'
      - '.github/workflows/validate-raw-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate raw collection
        run: python scripts/validate_raw_data.py
      - name: Validate materialized source layer
        run: |
          if [ -f source_registry/registry.yaml ]; then
            python scripts/validate_materialized.py
          else
            echo 'Materialized source registry not created yet; skipping materialized-layer validation.'
          fi
      - name: Validate documentation
        run: python scripts/validate_docs.py
