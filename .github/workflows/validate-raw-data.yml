name: Validate repository knowledge artifacts

on:
  push:
    paths:
      - 'raw_data/**'
      - 'docs/**'
      - 'materialized_sources/**'
      - 'source_registry/**'
      - 'experiments/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-materialization.txt'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt
      - name: Run offline unit tests
        run: make test
      - name: Validate repository artifacts and the compiled v0 demo
        run: make validate
      - name: Verify byte-identical offline replay
        run: make reproducibility
