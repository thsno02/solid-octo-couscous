name: Materialize source families in parallel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-sources-parallel.yml'

permissions:
  contents: write

concurrency:
  group: materialize-source-families-parallel
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Normalize structurally invalid legacy source types
        run: python scripts/preflight_legacy_metadata.py

      - name: Materialize isolated source families
        run: |
          python scripts/materialize_parallel.py \
            --config pipeline/materialization.yaml \
            --arxiv-workers 2 \
            --github-workers 3
          python scripts/pin_materialized_selectors.py
          python scripts/register_materialization.py

      - name: Validate generated artifacts
        run: |
          python scripts/validate_materialized.py
          python scripts/validate_raw_data.py
          python scripts/validate_docs.py

      - name: Publish the first successful materialization only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git cat-file -e origin/main:source_registry/registry.yaml 2>/dev/null; then
            echo 'A validated materialization has already been published; keeping the remote result.'
            exit 0
          fi
          git add raw_data source_registry materialized_sources
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize P0 source families and migrate metadata'
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git fetch origin main
            if git cat-file -e origin/main:source_registry/registry.yaml 2>/dev/null; then
              echo 'Another validated materialization won the race; no publication needed.'
              exit 0
            fi
            exit 1
          fi
          git push origin HEAD:main
