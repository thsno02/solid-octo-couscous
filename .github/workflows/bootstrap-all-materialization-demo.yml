name: Bootstrap complete materialization and v0 demo

on:
  push:
    branches:
      - work/v0-meta-kb-initialization-demo-260910
    paths:
      - '.github/workflows/bootstrap-all-materialization-demo.yml'
      - '.bootstrap/materialize_bundle.part*'

permissions:
  contents: write

concurrency:
  group: bootstrap-v0-meta-kb-initialization-demo-260910
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and install the source-specific materialization pipeline
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/materialize_bundle.part* > /tmp/materialize_bundle.tgz
          echo '9ada541cc3bcafba36e6431a2bb4f5e6df3904fac43ba944fd23beab1fbc8d0a  /tmp/materialize_bundle.tgz' | sha256sum -c -
          tar -xzf /tmp/materialize_bundle.tgz -C .
          rm -rf .bootstrap
          rm -f \
            .github/workflows/bootstrap-all-materialization-demo.yml \
            .github/workflows/finalize-materialization-cleanup.yml \
            .github/workflows/materialize-sources-parallel.yml \
            .github/workflows/materialize-sources-resilient.yml \
            .github/workflows/materialize-sources-v2.yml \
            .github/workflows/materialize-sources.yml

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Materialize all collected sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/materialize_all_sources.py --config pipeline/materialization_all_260910.yaml

      - name: Validate complete local materialization
        run: python scripts/validate_materialization_completeness.py

      - name: Build and validate the v0 meta-KB experiment
        run: |
          python experiments/v0_meta_kb_initialization_demo_260910/pipeline/build_demo.py
          python experiments/v0_meta_kb_initialization_demo_260910/pipeline/validate_demo.py

      - name: Run repository-level checks
        run: |
          python scripts/validate_raw_data.py
          python scripts/validate_docs.py

      - name: Commit the validated corpus, engineering, and demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Materialize all collected sources and build v0 meta-KB initialization demo'
          git push \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}" \
            origin \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
