name: Build and verify v0 LLM Wiki demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/v0-meta-kb-initialization-demo-260910
    paths:
      - 'experiments/v0_meta_kb_initialization_demo_260910/**'
      - 'Makefile'
      - 'docs/llm-wiki/**'
      - 'raw_data/schemas/knowledge_model.schema.yaml'
      - 'raw_data/schemas/wiki_page.schema.yaml'
      - 'raw_data/schemas/wiki_change.schema.yaml'
      - 'scripts/verify_demo_reproducibility.py'
      - 'tests/**'
      - 'requirements-materialization.txt'
      - '.github/workflows/build-llm-wiki-demo.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-v0-llm-wiki-demo-260910-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Run offline unit tests
        run: make test

      - name: Run repository-level deterministic checks
        run: make validate

      # This must be the first build: capture the untouched checkout baseline.
      - name: Verify committed artifacts and byte-identical offline replay
        run: make reproducibility

      - name: Require generated artifacts to be committed
        run: git diff --exit-code -- experiments/v0_meta_kb_initialization_demo_260910
