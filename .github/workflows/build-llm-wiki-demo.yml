name: Build v0 LLM Wiki demo

on:
  workflow_dispatch:
  push:
    branches:
      - work/v0-meta-kb-initialization-demo-260910
    paths:
      - 'experiments/v0_meta_kb_initialization_demo_260910/pipeline/**'
      - 'experiments/v0_meta_kb_initialization_demo_260910/config.yaml'
      - 'experiments/v0_meta_kb_initialization_demo_260910/README.md'
      - 'Makefile'
      - 'docs/llm-wiki/**'
      - 'raw_data/schemas/wiki_page.schema.yaml'
      - 'raw_data/schemas/wiki_change.schema.yaml'
      - '.github/workflows/build-llm-wiki-demo.yml'

permissions:
  contents: write

concurrency:
  group: build-v0-llm-wiki-demo-260910
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Run offline unit tests
        run: make test

      - name: Rebuild and validate the complete v0 demo from local capsules
        run: make demo

      - name: Run repository-level deterministic checks
        run: make validate

      - name: Verify byte-identical offline replay
        run: make reproducibility

      - name: Commit the validated candidate demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v0_meta_kb_initialization_demo_260910
          if git diff --cached --quiet; then
            echo 'No generated wiki changes.'
            exit 0
          fi
          git commit -m 'Build validated v0 LLM Wiki candidate'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
