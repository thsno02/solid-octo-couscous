name: Materialize heterogeneous sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-sources.yml'

permissions:
  contents: write

concurrency:
  group: materialize-sources
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Materialize initial source batch
        run: python scripts/materialize_pipeline.py --config pipeline/materialization.yaml

      - name: Register generated interfaces
        run: python scripts/register_materialization.py

      - name: Validate generated artifacts
        run: |
          python scripts/validate_materialized.py
          python scripts/validate_raw_data.py
          python scripts/validate_docs.py

      - name: Commit materialized sources and migrated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add raw_data source_registry materialized_sources
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize P0 source batch and migrate metadata'
          git pull --rebase origin main
          git push origin HEAD:main
