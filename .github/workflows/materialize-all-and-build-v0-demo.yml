name: Materialize sources and propose repository update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Only the explicitly dispatched producer may write a proposal. CI stays read-only.
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.ref_name }}
      PROPOSAL_BRANCH: codex/materialize-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require a branch as the proposal base
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = branch

      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.13'

      - name: Install materialization dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Check existing publication clearance before fetching
        run: python scripts/validate_publication_rights.py

      - name: Run offline unit tests
        run: make test

      - name: Materialize, build, and validate the complete v0 demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make materialize

      - name: Verify the generated candidate is reproducible
        # This producer intentionally generates a new tree. The PR's independent
        # CI will compare its committed tree against the first rebuild.
        run: make reproducibility

      - name: Gate the exact generated revisions before any upload
        run: python scripts/validate_publication_rights.py

      - name: Commit generated data to a new proposal branch and open a PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- materialized_sources source_registry \
            raw_data/audits/materialization_completeness_2026-09-10.yaml \
            experiments/v0_meta_kb_initialization_demo_260910
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          if git diff --cached --quiet; then
            echo 'No generated changes; no upload or PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$PROPOSAL_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update materialized sources and derived candidate Wiki'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$PROPOSAL_BRANCH"
          echo "Generated text persisted in repository branch: $PROPOSAL_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" --head "$PROPOSAL_BRANCH" --draft \
            --title 'Materialization: update source text and derived candidate artifacts' \
            --body 'Generated by the manual materialization pipeline. Tests, replay and exact-revision publication checks passed before upload. Text and derived artifacts are committed to this repository for remote continuation. Approve workflows to run if GitHub requests it, then inspect the independent Quality gate and review the diff. This proposal does not approve editorial admission or merge itself.'
