name: Materialize all sources and build v0 meta-KB demo

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write

concurrency:
  group: v0-meta-kb-initialization-demo-260910
  cancel-in-progress: false

jobs:
  materialize-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install materialization dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Run offline unit tests
        run: make test

      - name: Materialize, build, and validate the complete v0 demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make materialize

      - name: Verify byte-identical offline replay
        run: make reproducibility

      - name: Gate public redistribution on explicit rights review
        run: python scripts/validate_publication_rights.py

      - name: Commit the validated local corpus and demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            materialized_sources \
            source_registry \
            raw_data/audits/materialization_completeness_2026-09-10.yaml \
            experiments/v0_meta_kb_initialization_demo_260910
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize complete local corpus and build v0 meta-KB demo'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
