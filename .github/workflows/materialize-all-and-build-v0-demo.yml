name: Materialize all sources and build v0 meta-KB demo

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write

concurrency:
  group: v0-meta-kb-initialization-demo-260910
  cancel-in-progress: false

jobs:
  materialize-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install materialization dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Materialize every collected source into a local capsule
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/materialize_all_sources.py \
            --config pipeline/materialization_all_260910.yaml

      - name: Validate corpus completeness, hashes, selectors, registry, and index
        run: python scripts/validate_materialization_completeness.py

      - name: Build the v0 meta-KB experiment from local capsules
        run: python experiments/v0_meta_kb_initialization_demo_260910/pipeline/build_demo.py

      - name: Validate the v0 experiment
        run: python experiments/v0_meta_kb_initialization_demo_260910/pipeline/validate_demo.py

      - name: Run repository-level deterministic checks
        run: |
          python scripts/validate_raw_data.py
          python scripts/validate_docs.py

      - name: Commit the validated local corpus and demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            materialized_sources \
            source_registry \
            raw_data/audits/materialization_completeness_2026-09-10.yaml \
            experiments/v0_meta_kb_initialization_demo_260910
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize complete local corpus and build v0 meta-KB demo'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
