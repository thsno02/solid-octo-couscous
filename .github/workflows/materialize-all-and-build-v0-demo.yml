name: Acquire sources manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.13'

      - name: Install materialization dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-materialization.txt

      - name: Materialize, build, and validate the complete v0 demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make materialize

      # Diagnostic acquisition only: runner output is ephemeral. No commits,
      # uploads or publication. Public redistribution requires a separate review.
