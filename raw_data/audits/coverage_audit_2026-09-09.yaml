remaining_priorities:
  P0:
    - 'Validate every existing 2025-2026 identifier against a canonical primary source and quarantine unresolved entries.'
    - 'Migrate all legacy YAML records to the common schema without losing source-specific fields.'
    - 'Materialize arXiv source archives with version and checksum; do not treat URL-only records as full-text acquired.'
    - 'Create first-class datasets/benchmarks records and link benchmark claims to exact versions.'
  P1:
    - 'Add temporal-KG datasets, stale-knowledge/freshness benchmarks, retraction and contradiction corpora.'
    - 'Add self-driving-lab optimization stacks and real closed-loop experiment traces.'
    - 'Add formal verification, theorem proving, mechanistic interpretability and causal-discovery research loops.'
    - 'Add incidents/negative results: failed replications, reward hacking, evaluator gaming and unsafe self-modification.'
  P2:
    - 'Cover institutional and social knowledge evolution: peer review, scientific consensus, incentives and multi-lab coordination.'
    - 'Add patents, standards activity and production postmortems where primary records are available.'

execution_sequence:
  - step: 1
    name: canonicalize
    deliverable: 'stable uid, canonical ids, aliases and verification states'
  - step: 2
    name: backfill_foundations
    deliverable: 'continual learning, belief revision, temporal KG, novelty search and provenance'
  - step: 3
    name: link_papers_and_code
    deliverable: 'bidirectional paper-repo-dataset-benchmark relations'
  - step: 4
    name: materialize_primary_text
    deliverable: 'versioned TeX/PDF/source snapshots with hashes and licenses'
  - step: 5
    name: schedule_discovery
    deliverable: 'source-specific queries, cadence, deduplication and change detection'
  - step: 6
    name: enforce_promotion_gates
    deliverable: 'claim/evidence lineage, contradiction handling, replication and rollback'

acceptance_metrics:
