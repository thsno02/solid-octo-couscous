  verification_timestamp_coverage_target: '100%'
  paper_code_linkage_target_for_implemented_methods: '>= 90%'
  source_version_or_commit_coverage_target: '>= 95%'
  license_status_coverage_target_for_github_projects: '100%'
  unresolved_duplicate_rate_target: '< 1%'
  p0_full_text_materialization_target: '100% where legally and technically available'
  generated_claims_with_provenance_target: '100%'
  generated_claims_independently_verified_before_trusted_promotion_target: '100%'
