initial_failure_and_fix:
  failed_run_id: 34256569595
  failed_commit: 8a4517598a5a45e1f421ebd8c462e2647b64dcb0
  initial_blocking_errors: 33
  cause: >-
    The first schema modeled provenance preservation and reversibility as booleans, while existing
    metadata used legitimate graded states such as partial, mixed, conceptual and not_applicable.
    One legacy record also used author_reproduced as an evidence level rather than a replication status.
  remediation:
    - accept graded legacy governance states during migration
    - add not_applicable to evaluator independence
    - accept author_reproduced as a deprecated evidence-level compatibility value
    - recommend structured assessments for new records instead of ambiguous scalar booleans
  lesson: >-
    Governance and epistemic attributes often require qualified, scoped assessments. Binary fields
    can erase useful distinctions and cause a validation schema to reject more expressive evidence.

