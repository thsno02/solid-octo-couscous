consumer_rules:
- Load the base manifest and every additive manifest; deduplicate by canonical_id.
- Resolve GitHub aliases before counting coverage.
- Exclude quarantined and deprecated records from the trusted layer but retain them in lineage.
- Prefer canonical_id and uid over folder names or titles.
- Treat partially_verified records as discovery metadata, not final trusted knowledge.
- Do not infer open-source status when license verification is pending.
- Do not collapse taxonomy, vocabulary, ontology, schema, shape, semantic layer, data contract and operational ontology.
- Declare open-world, closed-world or local-closed-world assumptions for every reasoning and validation pipeline.
- Treat mappings and source bindings as versioned evidence-bearing objects.
- Distinguish observation, assertion, inference, prediction, decision and action.
- Every breaking semantic change requires compatibility assessment, migration, impact analysis and rollback.
- Schema/SHACL conformance, source authenticity and factual truth are separate checks.
- Treat wiki pages as compiled views over source and claim layers, never as sole truth records.
- Generated wiki edits are proposals and require the declared validation and admission path.
- Every promoted factual paragraph has source support; high-risk claims require atomic evidence selectors.
- Do not use the wiki itself or a derivative mirror as independent corroboration.
- Preserve conflicting claims, source removal, supersession, retraction and rollback lineage.
- Select a source-specific adapter before consumption; a canonical URL alone is not a consumable artifact.
- A GitHub repository must be frozen at a commit and semanticized into a repo-wiki capsule before LLM Wiki use.
- Direct TeX is preferred for arXiv; PDF is a fallback that must retain page selectors.
- Deterministic repository capsules are review candidates, not verified runtime descriptions.
generated_artifacts:
