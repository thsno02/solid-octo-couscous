$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/thsno02/solid-octo-couscous/raw_data/schemas/wiki_change.schema.yaml
title: LLM Wiki change proposal
description: A reviewable, reproducible and reversible proposal to change compiled pages, links, indexes or admission
  state.
type: object
additionalProperties: true
required:
- change_id
- trigger
- base_revision
- affected_pages
- affected_claims
- operations
- validation
- review
- rollout
- rollback
- status
properties:
  change_id:
    type: string
    pattern: '^wiki-change:'
  trigger:
    type: string
    enum:
    - source_ingest
    - source_update
    - source_removal
    - source_retraction
    - query_fileback
    - lint_repair
    - schema_change
    - manual_edit
    - scheduled_rebuild
    - entity_merge
    - entity_split
    - policy_change
  trigger_ref:
    type:
    - string
    - 'null'
  base_revision:
    type: string
  proposed_revision:
    type:
    - string
    - 'null'
  build_id:
    type:
    - string
    - 'null'
  source_deltas:
    type: array
    items:
      type: object
      required:
      - source_ref
      - change_type
      properties:
        source_ref:
          type: string
        change_type:
          type: string
          enum:
          - added
          - updated
          - removed
          - retracted
        before_revision:
          type:
          - string
          - 'null'
        after_revision:
          type:
          - string
          - 'null'
  affected_pages:
    type: array
    items:
      type: string
  affected_claims:
    type: array
    items:
      type: string
  affected_indexes_and_consumers:
    type: array
    items:
      type: string
  operations:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - operation
      - target_ref
      - reason
      properties:
        operation:
          type: string
          enum:
          - create
          - update
          - split
          - merge
          - archive
          - supersede
          - retract
          - repair_link
          - rebuild_index
          - rebuild_context_pack
        target_ref:
          type: string
        reason:
          type: string
        patch_ref:
          type:
          - string
          - 'null'
        claim_refs:
          type: array
          items:
            type: string
  semantic_diff:
    type: object
    properties:
      added_claims:
        type: array
        items:
          type: string
      removed_claims:
        type: array
        items:
          type: string
      changed_scope_or_qualifiers:
        type: array
        items:
          type: string
      identity_changes:
        type: array
        items:
          type: string
      ontology_changes:
        type: array
        items:
          type: string
      editorial_changes:
        type: array
        items:
          type: string
      compatibility:
        type: string
        enum:
        - backward-compatible
        - additive-behavior-change
        - breaking
        - epistemically-breaking
        - not-applicable
  validation:
    type: object
    required:
    - schema
    - links
    - citations
    - factuality
    - contradictions
    - identity
    - neutrality
    - policy
    properties:
      schema:
        $ref: '#/$defs/check'
      links:
        $ref: '#/$defs/check'
      citations:
        $ref: '#/$defs/check'
      factuality:
        $ref: '#/$defs/check'
      contradictions:
        $ref: '#/$defs/check'
      identity:
        $ref: '#/$defs/check'
      neutrality:
        $ref: '#/$defs/check'
      policy:
        $ref: '#/$defs/check'
      evaluation_run_refs:
        type: array
        items:
          type: string
  review:
    type: object
    required:
    - required
    - state
    - reviewers
    properties:
      required:
        type: boolean
      state:
        type: string
        enum:
        - not_started
        - in_review
        - approved
        - rejected
        - needs_revision
      reviewers:
        type: array
        items:
          type: string
      decision_ref:
        type:
        - string
        - 'null'
      discussion_ref:
        type:
        - string
        - 'null'
  rollout:
    type: object
    required:
    - mode
    properties:
      mode:
        type: string
        enum:
        - none
        - canary
        - full
      canary_consumers:
        type: array
        items:
          type: string
      start_at:
        type:
        - string
        - 'null'
      success_criteria:
        type: array
        items:
          type: string
  rollback:
    type: object
    required:
    - available
    - plan
    properties:
      available:
        type: boolean
      plan:
        type: string
      target_revision:
        type:
        - string
        - 'null'
      compensating_operations:
        type: array
        items:
          type: string
      tested:
        type: boolean
  status:
    type: string
    enum:
    - proposed
    - validated
    - approved
    - rejected
    - merged
    - rolled_back
$defs:
  check:
    type: object
    required:
    - status
    properties:
      status:
        type: string
        enum:
        - not_run
        - pass
        - warn
        - fail
      details:
        type:
        - string
        - 'null'
      artifact_ref:
        type:
        - string
        - 'null'
allOf:
- if:
    properties:
      status:
        const: merged
  then:
    properties:
      review:
        properties:
          state:
            const: approved
      validation:
        properties:
          schema:
            properties:
              status:
                enum:
                - pass
                - warn
          links:
            properties:
              status:
                enum:
                - pass
                - warn
          citations:
            properties:
              status:
                enum:
                - pass
                - warn
          policy:
            properties:
              status:
                enum:
                - pass
                - warn
design_notes:
- Agents propose changes; they do not directly overwrite published pages.
- A source removal or retraction must identify dependent claims and pages.
- Semantic diff records meaning changes, not only line changes.
- Rollback must restore indexes and consumer packs as well as Markdown files.
