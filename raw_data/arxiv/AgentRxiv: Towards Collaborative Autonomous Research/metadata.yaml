why_collected: 'A direct bridge between autonomous research and knowledge self-evolution: agent laboratories upload,
  retrieve and build on each others research, creating cumulative improvement across generations of work.'
knowledge_evolution_link: Implements an explicit write-back loop from research outputs into a shared knowledge repository
  that future agents retrieve from. This is a concrete architecture for knowledge accumulation driving further capability
  improvement.
