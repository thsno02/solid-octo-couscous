why_collected: 'One of the strongest demonstrations of a lab-in-the-loop discovery cycle: background research, hypothesis
  generation, experimental planning, human-executed wet-lab experiments, data analysis, and updated hypotheses.'
knowledge_evolution_link: 'Explicitly closes the evidence loop: experimental results can invalidate or update prior
  hypotheses, so the knowledge state changes based on newly generated evidence rather than only newly retrieved
  documents.'
