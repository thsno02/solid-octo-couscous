  mappings_and_source_binding: [SSSOM, R2RML, source-version, mapping-evidence]
  ontology_schema_evolution: [semantic-diff, compatibility, migration, impact, rollback]
  operational_ontology_and_actions: [typed-actions, preconditions, effects, authorization, action-log]
  identity_and_entity_resolution: [stable-id, alias, merge, split, confidence, reviewer]
  claims_evidence_and_epistemics: [claim, evidence, contradiction, derivation, status]
  uncertainty_and_calibration: [uncertainty-type, calibration, evidence-quality, aggregation-rule]
  time_context_and_measurement: [valid-time, transaction-time, context, unit, precision]
  policy_permissions_and_privacy: [permission, prohibition, duty, purpose, jurisdiction]
  catalog_federation_and_contracts: [DCAT, contract, ownership, federation, distribution-version]
