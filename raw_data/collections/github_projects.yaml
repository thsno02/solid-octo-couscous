collection: github-projects
version: 1
collected_at: '2026-09-08'
status: active
purpose: 'Track open-source and source-available implementations that operationalize RSI, self-evolving agents, autonomous research, evolving memory/knowledge systems, and evaluation/governance.'

inclusion_rule: >-
  Include projects only when the implementation exposes a meaningful evolution loop or a necessary substrate:
  mutation/optimization, persistent learning, autonomous research, incremental knowledge maintenance,
  evidence-based evaluation, or governance/verification. Generic agent orchestration alone is insufficient.

categories:
  rsi_self_evolution:
    P0: ['jennyzzt/dgm', 'EvoAgentX/EvoAgentX', 'FoundationAgents/AFlow', 'gepa-ai/gepa']
    P1: ['stanfordnlp/dspy', 'zou-group/textgrad', 'google-deepmind/opro']
  auto_research:
    P0: ['SakanaAI/AI-Scientist', 'SakanaAI/AI-Scientist-v2', 'SamuelSchmidgall/AgentLaboratory', 'Future-House/robin']
    P1: ['Future-House/paper-qa', 'zou-group/virtual-lab', 'ur-whitelab/chemcrow-public', 'allenai/discoveryworld']
  evaluation_governance:
    P0: ['openai/frontier-evals', 'facebookresearch/MLGym']
  knowledge_memory_evolution:
    P0: ['getzep/graphiti', 'letta-ai/letta-code', 'langchain-ai/langmem', 'OSU-NLP-Group/HippoRAG']
    P1: ['mem0ai/mem0', 'topoteretes/cognee', 'HKUDS/LightRAG', 'OpenSPG/KAG', 'microsoft/graphrag']

cross_domain_patterns:
  variation: [self-code-edit, prompt-mutation, workflow-search, hypothesis-generation, memory-write, graph-update]
  evaluation: [benchmarks, textual-feedback, scientific-evidence, replication, task-metrics]
  selection: [pareto-frontier, score-ranking, tree-search, experiment-outcomes, verification-gates]
  retention: [archives, persistent-memory, temporal-graphs, research-repositories, experiment-traces]
  recombination: [workflow-composition, multi-agent-collaboration, cross-paper-synthesis, graph-reasoning]
  governance: [sandboxing, provenance, temporal-validity, replication, permissions, rollback]

notes:
  - 'The directory stores metadata only; source repositories are not vendored.'
  - 'Source-available projects with custom licenses are explicitly distinguished from OSI-style open-source licenses.'
  - 'Snapshot fields should be refreshed by a scheduled collector because project ownership, licenses, activity, and architecture may change.'
