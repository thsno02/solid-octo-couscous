collection: github-projects
version: 2
collected_at: '2026-09-09'
status: active
purpose: >-
  Track open-source and source-available implementations that operationalize RSI, open-ended
  evolution, continual learning, autonomous research, evolving memory/knowledge systems,
  scientific provenance, experiment automation, evaluation and governance.

inclusion_rule: >-
  Include a project only when it exposes a meaningful evolution mechanism or necessary substrate:
  mutation/optimization, persistent learning, knowledge revision, autonomous research,
  incremental knowledge maintenance, executable evaluation, provenance, versioning, rollback,
  experiment orchestration or governance. Generic agent orchestration alone is insufficient.

canonicalization:
  identity_key: lowercase_owner_repo_after_redirect_resolution
  required_fields: [canonical_id, verification, versioning, rights, classification, collection]
  aliases:
    'EvoAgentX/EvoAgentX': 'ANative-Lab/EvoAgentX'
  policy: 'Retain alias lineage, but count only the canonical repository in coverage metrics.'

