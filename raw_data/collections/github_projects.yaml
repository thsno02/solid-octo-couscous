coverage_requirements:
  conceptual_plus_implementation: true
  paper_code_bidirectional_linkage_target: '>= 90% for P0 implemented methods'
  canonical_repository_verification_target: '100%'
  license_status_target: '100% explicit verified or pending; never inferred'
  snapshot_commit_target: '>= 95% after scheduled materialization'
  archived_or_redirected_projects_remain_in_lineage: true

known_followups:
  - 'Resolve the relationship between letta-ai/letta-code and the canonical Letta platform repository.'
  - 'Capture exact head commit, default branch, release, archive state and license for every project.'
  - 'Add closed-loop laboratory optimization frameworks after canonical project verification.'
  - 'Add causal-discovery, theorem-proving and mechanistic-interpretability research loops.'
  - 'Add negative evidence: abandoned projects, failed replications and evaluator-gaming incidents.'

notes:
  - 'The directory stores metadata only; source repositories are not vendored.'
  - 'Source-available projects with custom licenses are explicitly distinguished from OSI-style open source.'
  - 'A project may appear in several categories but is counted once by canonical_id.'
  - 'Snapshot fields must be refreshed by a scheduled collector because ownership, licenses, activity and architecture may change.'
