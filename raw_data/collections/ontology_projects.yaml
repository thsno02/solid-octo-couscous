collection: ontology-projects
version: 1
created_at: '2026-09-09'
status: active
purpose: 'Track open implementations across the full ontology and semantic-model lifecycle.'

categories:
  authoring_and_collaboration:
    P0: [protegeproject/protege, protegeproject/webprotege]
  schema_first_and_model_compilation:
    P0: [linkml/linkml]
  ontology_ci_release_and_modularization:
    P0: [ontodev/robot, INCATools/ontology-development-kit]
  validation_and_semantic_runtime:
    P0: [RDFLib/pySHACL, apache/jena]
    P1: [RDFLib/rdflib, eclipse-rdf4j/rdf4j, typedb/typedb]
  mapping_reconciliation_and_source_binding:
    P0: [mapping-commons/sssom, OpenRefine/OpenRefine, ontop/ontop]
  versioned_operational_knowledge:
    P0: [terminusdb/terminusdb, FIWARE/context.Orion-LD]
  ontology_learning_and_population:
    P1: [monarch-initiative/ontogpt]
  active_metadata_catalog_and_impact:
    P0: [datahub-project/datahub, open-metadata/OpenMetadata]
  policy_and_authorization:
    P0: [open-policy-agent/opa, cedar-policy/cedar]
  research_object_and_reproducibility:
    P0: [ResearchObject/ro-crate-py]
  data_contracts:
    P0: [bitol-io/open-data-contract-standard]

open_stack_analogue_to_operational_ontology:
  model: [LinkML, OWL-2, SKOS, OntoUML]
  validation: [SHACL, pySHACL, Apache-Jena]
  mapping: [SSSOM, R2RML, Ontop, OpenRefine]
  live_context: [NGSI-LD, Orion-LD]
  versioning: [TerminusDB, ODK, ROBOT, WebProtege]
  action_and_policy: [ODRL, OPA, Cedar]
  provenance_and_research_objects: [PROV-O, RO-Crate, OpenLineage]
  catalog_and_impact: [DCAT-3, DataHub, OpenMetadata]

selection_rules:
  - 'A graph database alone is not enough; include it only for distinctive semantic, versioning, inference or governance capabilities.'
  - 'Track canonical repository, license, release, head commit and archive state on each refresh.'
  - 'Distinguish official implementation, research artifact and third-party reimplementation.'
  - 'A project can occupy several layers but is counted once by canonical_id.'

known_gaps:
  - production-grade-open-action-ontology-framework
  - semantic-diff-and-migration-benchmark
  - entity-merge-split-governance-platform
  - probabilistic-knowledge-and-calibration-tooling
  - multilingual-ontology-engineering
  - ontology-change-impact-benchmarks-for-agents
