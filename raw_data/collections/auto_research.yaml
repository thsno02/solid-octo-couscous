collection: auto-research
version: 1
collected_at: '2026-09-08'
status: active
purpose: >-
  Track autonomous research as a concrete realization of self-evolution in a domain where
  agents consume existing knowledge, generate hypotheses, produce new evidence, revise claims,
  publish artifacts, and feed those artifacts back into future research cycles.

core_loop:
  - literature_acquisition
  - evidence_synthesis
  - problem_or_hypothesis_generation
  - critique_and_selection
  - experiment_design
  - experiment_execution
  - result_analysis
  - claim_update
  - provenance_and_verification
  - publication_or_knowledge_writeback
  - next_problem_generation

subfields:
  literature_intelligence:
    description: 'Retrieve, synthesize, cross-check and detect contradictions in existing scientific knowledge.'
    papers:
      - '2411.14199' # OpenScholar
      - '2409.13740' # PaperQA2
      - '2504.03160' # DeepResearcher

  hypothesis_and_idea_evolution:
    description: 'Generate populations of hypotheses/research ideas, critique, rank, preserve diversity and iteratively evolve them.'
    papers:
      - '2404.07738' # ResearchAgent
      - '2502.18864' # AI co-scientist
      - '2504.08066' # AI Scientist v2

  end_to_end_autonomous_research:
    description: 'Run substantial parts of the full research lifecycle from literature to experiments and research reports.'
    papers:
      - '2408.06292' # AI Scientist v1
      - '2501.04227' # Agent Laboratory
      - '2505.13400' # Robin
      - '2511.02824' # Kosmos

  cumulative_and_collaborative_science:
    description: 'Persist research outputs so later agents/labs can retrieve, inherit, recombine and improve prior work.'
    papers:
      - '2503.18102' # AgentRxiv
    frontier_sources:
      - 'bioRxiv:10.64898/2026.08.16.745122' # Persistent AI scientist fleet

  autonomous_experimentation:
    description: 'Connect scientific reasoning to tools, physical or simulated experiments, and evidence-generating environments.'
    papers:
      - '2304.05376' # ChemCrow
      - '2509.25651' # AutoLabs
      - '2406.06769' # DiscoveryWorld
    non_arxiv_sources:
      - 'Nature:10.1038/s41586-023-06792-0' # Autonomous chemical research
      - 'bioRxiv:10.1101/2024.11.11.623004' # Virtual Lab

  research_evaluation_and_governance:
    description: 'Evaluate whether autonomous research is reproducible, scientifically useful and safe to promote into durable knowledge.'
    papers:
      - '2410.07095' # MLE-bench
      - '2502.14499' # MLGym
      - '2504.01848' # PaperBench
      - '2602.06855' # AIRS-Bench

knowledge_evolution_mapping:
  variation:
    - new research questions
    - hypotheses
    - methods
    - experimental protocols
    - agent workflows
  evaluation:
    - literature evidence
    - automated critics and reviewers
    - execution metrics
    - wet-lab or simulated experiments
    - replication
    - human/expert review
  selection:
    - hypothesis ranking
    - experiment outcomes
    - peer review
    - benchmark performance
  retention:
    - papers and reports
    - code and experiment traces
    - world models
    - shared memory
    - knowledge graphs
    - preprint repositories
  recombination:
    - cross-paper synthesis
    - cross-domain concept transfer
    - multi-agent collaboration
    - reuse of prior research artifacts
  meta_evolution:
    - improving research agents
    - improving evaluators
    - evolving research workflows
    - generating the next research problem

collection_priority:
  P0:
    - '2503.18102' # AgentRxiv: direct knowledge write-back and cumulative progress
    - '2511.02824' # Kosmos: long-horizon world-model-based discovery
    - '2505.13400' # Robin: evidence-updating wet-lab loop
    - '2502.18864' # AI co-scientist: explicit hypothesis evolution
    - '2408.06292' # AI Scientist: open-ended automated research loop
    - '2504.08066' # AI Scientist v2: tree-search research branching
  P1:
    - '2501.04227'
    - '2404.07738'
    - '2411.14199'
    - '2409.13740'
    - '2504.03160'
    - '2406.06769'
    - '2504.01848'
    - '2602.06855'
  P2:
    - '2410.07095'
    - '2502.14499'
    - '2304.05376'
    - '2509.25651'

notes:
  - 'Auto research is treated as a first-class self-evolution domain, not merely an adjacent application.'
  - 'Research outputs should be modeled as versioned claims with evidence, provenance and lineage rather than as unquestioned facts.'
  - 'Generated papers are not automatically trusted knowledge; replication and provenance are governance gates.'
