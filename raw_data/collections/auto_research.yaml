remaining_gaps:
  - failed replications and negative results as first-class records
  - causal discovery and intervention planning
  - autonomous peer-review calibration and reviewer independence
  - real experiment traces with instrument and environment snapshots
  - retraction, supersession and rollback workflows
  - permissions for who or which agent may promote a claim
  - benchmark contamination and circular self-evaluation detection

notes:
  - 'Auto research is a first-class self-evolution domain, not merely an adjacent application.'
  - 'Research outputs are versioned claims with evidence, provenance and lineage, not unquestioned facts.'
  - 'Generated papers are not automatically trusted knowledge; replication and provenance are promotion gates.'
  - 'Executable or formally verified outputs improve verification but do not eliminate objective and premise errors.'
  - 'Frontier records in quarantine remain visible for lineage but are excluded from trusted promotion until revalidated.'
