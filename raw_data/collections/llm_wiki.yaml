non_negotiable_rules:
- raw sources are immutable and separately versioned
- wiki pages are derived projections, not authoritative truth records
- generated edits are proposals; admission is a separate decision
- every promoted factual claim has evidence and source lineage
- paragraph-level citations are the minimum; high-risk claims require atomic claim links
- a citation must support the wording and scope of the claim
- the wiki must never cite itself or a derivative mirror as independent corroboration
- conflicting claims remain representable and must not be silently averaged away
- observation, assertion, inference and prediction remain distinct
- source removal or retraction triggers dependency-aware recompilation
- all page, claim and schema changes are reversible or explicitly marked irreversible
- LLM-as-judge is not the sole promotion gate
