collection: llm-wiki
version: 1
created_at: '2026-09-09'
status: active
purpose: 'Track LLM-compiled wiki systems as a distinct knowledge-organization paradigm: raw sources are transformed
  into persistent, cross-linked, reviewable knowledge artifacts that can be maintained, governed, evaluated and
  consumed by humans and agents.'
scope_definition:
  included:
  - compiled Markdown or semantic wikis maintained by LLM agents
  - research-to-outline and research-to-article systems
  - claim, citation, contradiction and factuality evaluation
  - Wikipedia-style editorial governance and consensus
  - Wikidata-style statement, qualifier, reference and rank models
  - revision, discussion, rollback and source-lineage infrastructure
  - agent and human consumption interfaces for compiled knowledge
  excluded_or_adjacent:
  - generic chat-with-documents without persistent knowledge compilation
  - vector retrieval alone without an editable durable knowledge layer
  - automatic documentation generators without evidence or maintenance semantics
  - ordinary note-taking applications unless they expose agent-maintained compilation or governance
central_thesis: An LLM wiki is a compiled and continuously maintained projection over source and claim layers. It
  is not itself the sole source of truth. Pages optimize navigation and synthesis; atomic claims, evidence, identity,
  ontology, time and change lineage carry epistemic authority.
