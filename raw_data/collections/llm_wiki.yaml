remaining_gaps:
  P0:
  - benchmark source deletion, retraction propagation and dependency-aware rebuild
  - define claim-level neutral synthesis and due-weight evaluation
  - test entity merge/split effects on page and link regeneration
  - create a gold benchmark for semantic staleness and wiki repair
  - formalize concurrent agent edit conflicts and review ownership
  - measure whether saved query answers introduce circular evidence
  P1:
  - multilingual compilation and cross-language citation fidelity
  - copyright-safe quotation and summarization policy by source type
  - privacy, right-to-erasure and derived-knowledge deletion
  - adversarial source and prompt-injection defenses
  - page layout and routing at million-document scale
  - human learning outcomes and editorial workload
