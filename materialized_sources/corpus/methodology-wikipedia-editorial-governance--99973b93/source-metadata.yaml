  risks:
  - verifiability is not identical to truth
  - consensus can suppress minority evidence if due weight is not preserved
  - circular sourcing and citogenesis can create false corroboration
  promotion_requirements:
  - preserve source and revision lineage
  - separate editorial acceptance from factual truth
  - retain rejected or superseded proposals in history
