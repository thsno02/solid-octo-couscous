why_collected: 'A strong literature-layer foundation for automated research: searches a 45M-paper scientific datastore,
  produces citation-backed synthesis, and iteratively refines outputs with self-feedback.'
knowledge_evolution_link: Represents the evidence ingestion and synthesis layer needed before autonomous hypothesis
  evolution; also highlights citation/provenance as first-class constraints on knowledge updates.
