limitations:
- Collector assembly is derived, not an official single-file Markdown; schema remains native YAML and is also fully
  fenced, with original source-line provenance.
- Source spec-model uses extension_definition but TSV/schema use extension_definitions; OWL table spells EauivalentClass.
  Original source inconsistencies retained, not silently corrected.
- JSON serialisation is explicitly unspecified upstream; chaining rules are structural tooling suggestions, not
  an assertion of new normative semantics.
- External linkml:types and cited standards are reference/runtime dependencies; offline body consumption is not
  an executable LinkML runtime.
- Missing generated field-page links are explicitly routed to local authoritative YAML. Canonical TSV Slots-order
  links point to preserved official 1.0 class HTML tables, whose sequence matches class lists, not the top-level
  slots definition order.
- The two HTML snapshots are versioned-deployment corroboration, not asserted fixed-tag generated bytes; scripts/styles/site
  assets are not downloaded.
