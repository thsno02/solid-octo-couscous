why_collected: A multi-agent scientific reasoning system organized around Generation, Reflection, Ranking, Evolution,
  Proximity and Meta-review agents. It explicitly iterates hypotheses through automated feedback and evolutionary
  selection.
knowledge_evolution_link: 'Provides one of the clearest mechanisms for evolving a population of knowledge claims:
  generate hypotheses, critique them, rank them, preserve diversity, evolve promising candidates, and meta-review
  the population.'
