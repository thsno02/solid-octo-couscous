why_collected: Long-horizon autonomous data-driven discovery. Kosmos repeatedly interleaves literature search, data
  analysis and hypothesis generation while maintaining a structured world model across hundreds of agent rollouts.
knowledge_evolution_link: The shared world model is an explicit evolving knowledge state used to coordinate literature
  and analysis agents over long horizons; every cycle can add, revise or connect evidence-backed claims.
