why_collected: End-to-end autonomous scientific discovery without a fixed human-authored template. Iteratively formulates
  hypotheses, designs and executes experiments, analyzes results, and writes papers using an agentic tree-search
  process.
knowledge_evolution_link: Makes research-state branching and experimental evidence part of an explicit search tree;
  useful model for maintaining competing knowledge hypotheses rather than overwriting a single current belief.
